[project]
name = "trustdesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "planoraforstudents", email = "planoraforstudents@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trustdesk = "trustdesk:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
